<svg id="play" xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
<title id="title">Submit your game — Neon Run</title>
<desc id="desc">A looping neon arcade button. A tiny adventurer runs and jumps through a scrolling world, collecting gold crystals while a spaceship crosses the sky. A glowing controller and stationary Submit your game lettering stay in the foreground.</desc>
<defs>
  <linearGradient id="face" x2=".8" y2="1"><stop stop-color="#0a1642"/><stop offset=".5" stop-color="#080e2b"/><stop offset="1" stop-color="#15205a"/></linearGradient>
  <linearGradient id="neon"><stop stop-color="#dc5aff"/><stop offset=".35" stop-color="#7766ff"/><stop offset=".7" stop-color="#32d9ff"/><stop offset="1" stop-color="#5cfff5"/></linearGradient>
  <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".65" stop-color="#e9f5ff"/><stop offset="1" stop-color="#93caff"/></linearGradient>
  <linearGradient id="gameLetters" x2="0" y2="1"><stop stop-color="#ecffff"/><stop offset=".5" stop-color="#74f4ff"/><stop offset="1" stop-color="#20baff"/></linearGradient>
  <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#164667"/><stop offset="1" stop-color="#080f2f"/></linearGradient>
  <linearGradient id="trail"><stop stop-color="#00deff" stop-opacity="0"/><stop offset="1" stop-color="#69f8ff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#6352fc" stop-opacity=".55"/><stop offset="1" stop-color="#3934be" stop-opacity="0"/></radialGradient>
  <radialGradient id="shade"><stop stop-color="#050c27" stop-opacity=".98"/><stop offset=".65" stop-color="#060d2a" stop-opacity=".9"/><stop offset="1" stop-color="#080d2a" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
  <clipPath id="capsule"><rect x="22" y="22" width="1236" height="296" rx="148"/></clipPath>
  <path id="rim" d="M170 22H1110a148 148 0 0 1 0 296H170a148 148 0 0 1 0-296Z"/>
  <g id="mountains"><path d="M0 268V171l68-46 45 28 70-93 70 72 48-27 86 85 69-46 70 38 82-96 69 77 76-31 107 136Z" fill="#25265e"/><path d="m150 155 33-95 70 72-54-25Z" fill="#454384"/><path d="m570 159 38-73 69 77-59-39Z" fill="#343773"/></g>
  <g id="terrain"><path d="M0 283v-19h130v19h87v-19h120v19h84v-19h160v19h79v-19h120v76H0Z" fill="url(#ground)"/><path d="M0 265h130m87 0h120m84 0h160m79 0h120" stroke="#42f4d6" stroke-width="3"/><path d="M0 273h123m102 0h104m100 0h144m95 0h112" stroke="#238fbe" stroke-width="2"/><g fill="none" stroke="#3685b5" stroke-opacity=".25"><path d="M32 287h80v28H32Zm210 0h70v28h-70Zm205 0h86v28h-86Zm238 0h70v28h-70Z"/></g></g>
  <g id="crystal"><path d="m0-14 9 14-9 14L-9 0Z" fill="#ffcc58" stroke="#fff3b8" stroke-width="1.5"/><path d="M0-14V14L9 0Z" fill="#ff971f"/><path d="m-9 0 9-3 9 3-9 3Z" fill="#fff4ab"/></g>
  <g id="star" fill="#a9ddff"><path d="M0-4 1-1 4 0 1 1 0 4-1 1-4 0-1-1Z"/></g>
</defs>
<style>
  .mountains{animation:panFar 24s linear infinite}.terrain{animation:pan 4s linear infinite}.coins{animation:pan 4s linear infinite}.pickup{animation:pickup 4s linear infinite}
  .hero{animation:jump 4s linear infinite}.leg-a{animation:stride .4s ease-in-out infinite alternate;transform-origin:0px -19px}.leg-b{animation:stride .4s ease-in-out infinite alternate-reverse;transform-origin:0px -19px}.scarf{animation:scarf .3s ease-in-out infinite alternate;transform-origin:-8px -41px}
  .ship{animation:fly 12s linear infinite}.twinkle{animation:twinkle 3s ease-in-out infinite alternate}.twinkle.two{animation-delay:-1.5s}
  .controller{animation:float 4s ease-in-out infinite}.press-a{animation:press 1s steps(2,end) infinite}.press-b{animation:press 1.5s steps(2,end) infinite reverse}
  .rim-runner{stroke-dasharray:170 2928;animation:rim 6s linear infinite}.collect{animation:collect 4s ease-out infinite;transform-origin:774px 207px}.orbit{animation:orbit 4s ease-in-out infinite}
  @keyframes pickup{0%,47.9%{opacity:1}48%,100%{opacity:0}}
  @keyframes pan{to{transform:translateX(-780px)}}@keyframes panFar{to{transform:translateX(-780px)}}
  @keyframes jump{0%,30%,76%,100%{transform:translate(774px,263px)}40%{transform:translate(774px,248px)}50%{transform:translate(774px,240px)}60%{transform:translate(774px,244px)}70%{transform:translate(774px,255px)}}
  @keyframes stride{from{transform:rotate(-28deg)}to{transform:rotate(30deg)}}@keyframes scarf{to{transform:skewY(-14deg) scaleX(.86)}}
  @keyframes fly{0%{transform:translate(-260px,80px)}70%,100%{transform:translate(1500px,42px)}}
  @keyframes twinkle{from{opacity:.2}to{opacity:.85}}@keyframes float{0%,100%{transform:translateY(2px) rotate(-3deg)}50%{transform:translateY(-5px) rotate(1deg)}}
  @keyframes press{0%,65%{fill:#164483}66%,100%{fill:#82ffff;filter:url(#glow)}}@keyframes rim{to{stroke-dashoffset:-3098}}
  @keyframes collect{0%,43%{opacity:0;transform:scale(.3)}48%{opacity:1;transform:scale(.6)}64%,100%{opacity:0;transform:scale(1.6)}}
  @keyframes orbit{0%,100%{opacity:.4}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){:root:not(:target) *{animation:none!important}:root:not(:target) .hero{transform:translate(774px,263px)}:root:not(:target) .ship{transform:translate(960px,65px)}:root:not(:target) .collect{opacity:0}}
</style>
<!-- Keep the perimeter transparent and the scene clipped to the capsule. -->
<use href="#rim" fill="none" stroke="url(#neon)" stroke-width="9" opacity=".65" filter="url(#soft)"/>
<use href="#rim" fill="url(#face)"/>
<g clip-path="url(#capsule)">
  <ellipse cx="180" cy="155" rx="320" ry="220" fill="url(#aura)"/>
  <ellipse cx="1070" cy="260" rx="520" ry="240" fill="url(#aura)" opacity=".7"/>
  <g opacity=".17" stroke="#5e89f2"><path d="M0 90H1280M0 140H1280M0 190H1280M0 240H1280M100 0V340M200 0V340M300 0V340M400 0V340M500 0V340M600 0V340M700 0V340M800 0V340M900 0V340M1000 0V340M1100 0V340M1200 0V340"/></g>
  <g class="twinkle"><use href="#star" x="300" y="70"/><use href="#star" x="690" y="58"/><use href="#star" x="1140" y="101"/><use href="#star" x="530" y="91"/></g>
  <g class="twinkle two"><use href="#star" x="390" y="46"/><use href="#star" x="865" y="92"/><use href="#star" x="1060" y="43"/><circle cx="610" cy="43" r="1.5" fill="#b5d7ff"/><circle cx="960" cy="111" r="1.5" fill="#b5d7ff"/></g>
  <circle cx="1100" cy="99" r="48" fill="#5144a9" opacity=".3"/><path d="M1090 53a48 48 0 0 1 47 70" fill="none" stroke="#a59aff" opacity=".5"/>
  <g class="mountains" opacity=".58"><use href="#mountains"/><use href="#mountains" x="780"/><use href="#mountains" x="1560"/></g>
  <g class="ship" transform="translate(960 65)"><path d="M-185 7H-9" stroke="url(#trail)" stroke-width="3"/><path d="M-100 16H-9" stroke="url(#trail)"/><path d="m-14 9 20-11 36 6-29 8-8 12-13-3 3-9Z" fill="#b8deff" stroke="#5cbfff"/><path d="m7 3 12 2-9 5H0Z" fill="#2769ce"/><path d="M-16 10H-31" stroke="#5dfaff" stroke-width="5" filter="url(#glow)"/></g>
  <ellipse cx="763" cy="157" rx="545" ry="76" fill="url(#shade)"/>
  <g class="terrain"><use href="#terrain"/><use href="#terrain" x="780"/><use href="#terrain" x="1560"/></g>
  <g class="coins" filter="url(#glow)"><use class="pickup" href="#crystal" x="1164" y="207"/><use href="#crystal" x="1944" y="207"/><use href="#crystal" x="500" y="233"/><use href="#crystal" x="1280" y="233"/><use href="#crystal" x="2060" y="233"/></g>
  <ellipse cx="774" cy="267" rx="27" ry="4" fill="#05091e" opacity=".65"/>
  <g class="hero" transform="translate(774 263)">
    <path class="scarf" d="m-8-43-25-4-19 6 23 4-12 5 35-2Z" fill="#ff648f"/>
    <g stroke="#070d26" stroke-width="3" stroke-linejoin="round"><path class="leg-b" d="M-2-21 7-11 17-6 14 0H3L-9-16Z" fill="#6976ff"/><path class="leg-a" d="M-6-22-3-10-11-4-9 1H3L9-12 7-23Z" fill="#c1dcff"/>
    <path d="m-11-42 19-1 7 24-24 1Z" fill="#4793fc"/><path d="m7-39 8 5 10-5 4 6-12 10-13-8" fill="#72baff"/><path d="m-12-37-9 10 7 8 6-4-5-6 7-7" fill="#526ce8"/>
    <path d="M-15-58Q-12-72 4-69q20 3 15 24l-8 6h-19l-9-9Z" fill="#daeaff"/><path d="m-8-59 25 1v12l-26 1Z" fill="#101e48"/></g>
    <path d="M4-55v7m6-7v7" stroke="#67ffff" stroke-width="3" filter="url(#glow)"/><path d="M-13-41H9" stroke="#ff668e" stroke-width="5"/>
  </g>
  <g class="collect" opacity="0" stroke="#ffe995" stroke-width="3"><path d="M774 179v-9m0 65v9m-28-37h-9m65 0h9m-57-20-7-7m40 40 7 7m0-47-7 7m-33 33-7 7"/></g>
  <!-- Shade only the title band; leave the playable world visible underneath. -->
  <path d="M70 297Q640 339 1210 297" fill="none" stroke="#575bfe" opacity=".5"/>
</g>
<!-- Frame and circulating highlight. -->
<use href="#rim" fill="none" stroke="url(#neon)" stroke-width="4" filter="url(#glow)"/>
<rect x="30" y="30" width="1220" height="280" rx="140" fill="none" stroke="#87c9ff" stroke-opacity=".24"/>
<use class="rim-runner" href="#rim" fill="none" stroke="#d7ffff" stroke-width="3" stroke-linecap="round" opacity=".85" filter="url(#glow)"/>
<!-- The foreground controller mirrors the jump rhythm. -->
<g transform="translate(166 164)">
  <g class="controller">
    <ellipse cy="9" rx="115" ry="102" fill="url(#aura)"/>
    <path d="M-57-51Q-80-47-89-13l-13 65q-5 31 17 34 14 2 33-24l16-17h69l22 22q18 23 32 15 18-8 9-42L81-19Q71-54 51-54L21-45H-24Z" fill="#061331" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
    <path d="M-55-42Q-73-34-78-10L-92 48" fill="none" stroke="#f3a3ff" stroke-width="2" opacity=".8"/>
    <path d="M-56-21h14v18h18v14h-18v18h-14V11h-18V-3h18Z" fill="#ffd16b" stroke="#fff1b5" stroke-width="2" filter="url(#glow)"/>
    <g stroke="#76dfff" stroke-width="2"><circle class="press-a" cx="50" cy="-23" r="10" fill="#73f6ff"/><circle class="press-b" cx="73" cy="0" r="10" fill="#164483"/><circle class="press-a" cx="27" cy="0" r="10" fill="#164483"/><circle class="press-b" cx="50" cy="23" r="10" fill="#73f6ff"/></g>
    <path d="M-14 11h10m9 0h10" stroke="#5c73af" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path class="orbit" d="M-104 28q-29 56 48 55 84-1 163-83" fill="none" stroke="#ffbf53" stroke-width="3" filter="url(#glow)"/>
  <g transform="translate(76 -87)" fill="#ffe18c" filter="url(#glow)"><path d="m0-14 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/></g>
</g>
